<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Speed reader</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main>
  <div id="word"><span class="before"></span><span class="focal"></span><span class="after"></span></div>
  <output id="title"></output>
  <div class="row">
    <button id="play" type="button">Play</button>
    <output id="progress">0 / 0</output>
  </div>
  <div class="row">
    <input id="wpm" type="range" min="100" max="1000" step="10" value="300">
    <label for="wpm" id="wpm-label">300 wpm</label>
  </div>
  <label for="file" id="open">Open a .txt file</label>
  <input id="file" type="file" accept=".txt,text/plain">
</main>
</body>
</html>
